[package]
name = "gardal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ahmed Farghal <me@asoli.dev>"]
rust-version = "1.87.0"                              # MSRV
repository = "https://github.com/AhmedSoliman/gardal"
categories = ["asynchronous", "concurrency", "network-programming"]
keywords = ["rate-limit", "token-bucket", "throttle", "rate-limiter", "async"]
description = "Fast, lock-free token-bucket rate limiter with burst borrowing, pluggable clocks and storage, and Tokio stream throttling"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
async = ["tokio/sync", "tokio/time", "tokio/rt", "pin-project-lite", "futures"]

[dependencies]
quanta = { version = "0.13", default-features = false, optional = true }
likely_stable = { version = "0.1.3" }
tokio = { version = "1.47", features = ["sync", "time", "rt"], optional = true }
pin-project-lite = { version = "0.2", optional = true }
futures = { version = "0.3", optional = true }
tokio-hrtime = { version = "0.1", optional = true }

[dev-dependencies]
gardal = { path = ".", features = ["async", "tokio", "quanta"] }
criterion = { version = "0.8", default-features = false }
tokio = { version = "1", features = ["sync", "time", "test-util", "macros", "rt", "rt-multi-thread"] }
nonzero_ext = { version = "0.3" }
tokio-stream = { version = "0.1", features = ["time"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "time_ops"
harness = false

[profile.release]
opt-level = 3
lto = "thin"

[profile.bench]
inherits = "release"
debug = true
